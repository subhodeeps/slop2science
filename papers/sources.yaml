# Source registry. Every source this project uses, whether or not its file is committed.
#
# Rules: .claude/rules/sources.md and .claude/rules/bibliography.md
#   - every identifier that exists for the work, verified against the work itself;
#   - the exact version consulted (preprint vN vs. journal — they differ);
#   - role: primary | benchmark | method-reference | background;
#   - notes: what this project actually needs from it, specifically.
#
# `make fetch-source` appends entries here. Fill in role and notes by hand.

sources: []
